[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agnews"
version = "2.0.0"
description = "Does word order matter for news topic classification? FNN vs RNN vs LSTM vs Attention on AG News."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "datasets>=2.18",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
